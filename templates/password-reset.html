<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta name="x-apple-disable-message-reformatting" />
  </head>
  <body style="background-color:rgb(248,250,252)">
    <!--$--><!--html--><!--head--><!--body-->
    <table
      border="0"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      role="presentation"
      align="center">
      <tbody>
        <tr>
          <td
            style="background-color:rgb(248,250,252);font-family:Inter,Arial,sans-serif">
            <table
              align="center"
              width="100%"
              border="0"
              cellpadding="0"
              cellspacing="0"
              role="presentation"
              style="max-width:32rem;margin-right:auto;margin-left:auto;background-color:rgb(255,255,255);border-radius:0.5rem;box-shadow:0 0 rgb(0,0,0,0),0 0 rgb(0,0,0,0),0 0 rgb(0,0,0,0),0 0 rgb(0,0,0,0),0 1px 3px 0 var(--tw-shadow-color, rgb(0 0 0 / 0.1)),0 1px 2px -1px var(--tw-shadow-color, rgb(0 0 0 / 0.1));padding:2rem;border-color:rgb(202,230,216);border-style:solid;border-width:8px">
              <tbody>
                <tr style="width:100%">
                  <td>
                    <p
                      style="font-size:1.25rem;line-height:1.4;font-weight:700;color:rgb(116,190,153);margin-bottom:1rem;margin-top:16px">
                      Reset your password
                    </p>
                    <p
                      style="font-size:1rem;line-height:1.5;color:rgb(15,23,42);margin-bottom:1.5rem;margin-top:16px">
                      Click the button below to reset your password. If you did
                      not request a password reset, you can ignore this email.
                    </p>
                    <a
                      href="{{.ResetLink}}"
                      style="line-height:100%;text-decoration:none;display:inline-block;max-width:100%;mso-padding-alt:0px;background-color:rgb(116,190,153);color:rgb(255,255,255);padding-right:24px;padding-left:24px;padding-bottom:8px;padding-top:8px;border-radius:0.5rem;font-weight:600;box-shadow:0 0 rgb(0,0,0,0),0 0 rgb(0,0,0,0),0 0 rgb(0,0,0,0),0 0 rgb(0,0,0,0),0 1px 3px 0 var(--tw-shadow-color, rgb(0 0 0 / 0.1)),0 1px 2px -1px var(--tw-shadow-color, rgb(0 0 0 / 0.1));transition-property:color,background-color,border-color,outline-color,text-decoration-color,fill,stroke,--tw-gradient-from,--tw-gradient-via,--tw-gradient-to,opacity,box-shadow,transform,translate,scale,rotate,filter,-webkit-backdrop-filter,backdrop-filter,display,content-visibility,overlay,pointer-events;transition-timing-function:cubic-bezier(0.4,0,0.2,1);transition-duration:150ms;margin-bottom:1.5rem"
                      target="_blank"
                      ><span
                        ><!--[if mso]><i style="mso-font-width:400%;mso-text-raise:12" hidden>&#8202;&#8202;&#8202;</i><![endif]--></span
                      ><span
                        style="max-width:100%;display:inline-block;line-height:120%;mso-padding-alt:0px;mso-text-raise:6px"
                        >Reset Password</span
                      ><span
                        ><!--[if mso]><i style="mso-font-width:400%" hidden>&#8202;&#8202;&#8202;&#8203;</i><![endif]--></span
                      ></a
                    >
                    <p
                      style="font-size:0.75rem;line-height:1.3333333333333333;color:rgb(100,116,139);margin-top:16px;margin-bottom:16px">
                      This link will expire in 1 hour for your security.
                    </p>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
    <!--/$-->
  </body>
</html>
